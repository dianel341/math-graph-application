<!DOCTYPE html> <!-- HTML5 문서라는 뜻 -->
<html lang="ko"> <!-- 문서 언어: 한국어 -->

<head>
  <meta charset="UTF-8"> <!-- 한글 깨짐 방지 -->
  
  <!--
    모바일 화면 대응 설정
    width=device-width:
      기기 실제 너비 사용

    initial-scale=1.0:
      처음 확대 비율 100%
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>고등수학 그래프 계산기</title>

  <!-- ======================================================
       외부 라이브러리 CDN 연결
       ====================================================== -->

  <!--
    math.js
    수학 계산 라이브러리

    가능한 기능:
    - sin cos tan
    - log sqrt
    - 미분 derivative()
    - 행렬
    - 복소수
    - 수식 파싱
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js"></script>

  <!--
    Chart.js
    그래프 그리는 라이브러리

    canvas 위에 선그래프, 막대그래프 등을 그림
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>

  <style>

    /* ======================================================
       기본 초기화
       ====================================================== */

    /*
      브라우저마다 기본 margin/padding이 다름

      그래서 전부 제거 후
      직접 디자인하기 위해 reset 사용
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /*
      body = 전체 페이지
    */
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      color: #222;
      padding: 16px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    /* ======================================================
       전체 레이아웃
       ====================================================== */

    /*
      grid 사용 이유:

      PC에서는:
      [그래프][계산기]

      모바일에서는:
      [계산기]
      [그래프]

      이런 구조 만들기 쉬움
    */
    #app {
      display: grid;

      /*
        1fr:
        남은 공간 자동 채우기

        320px:
        오른쪽 계산기 고정 너비
      */
      grid-template-columns: 1fr 320px;

      gap: 16px;
    }

    /* ======================================================
       왼쪽 영역
       ====================================================== */

    #left {
      display: flex;

      /*
        세로 방향 정렬
      */
      flex-direction: column;

      gap: 12px;
    }

    /*
      그래프 박스
    */
    #graph-container {
      background: white;
      border-radius: 10px;
      border: 1px solid #ddd;
      overflow: hidden;
    }

    /*
      실제 canvas

      Chart.js가 여기에 그림
    */
    #graph {
      width: 100%;
      height: 360px;
      display: block;
    }

    /* ======================================================
       축 설정
       ====================================================== */

    #axis-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #axis-controls label {
      font-size: 12px;
      color: #666;
    }

    #axis-controls input {
      width: 70px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* ======================================================
       함수 목록
       ====================================================== */

    #func-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /*
      함수 한 줄
    */
    .func-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /*
      함수 색상 원
    */
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /*
      함수 입력칸
    */
    .func-input {
      flex: 1;

      /*
        수식은 monospace가 보기 좋음
      */
      font-family: 'Courier New', monospace;

      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .func-input:focus {
      outline: none;
      border-color: #378ADD;
    }

    /*
      삭제 버튼
    */
    .remove-btn {
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      color: #999;
    }

    .remove-btn:hover {
      color: #222;
    }

    /*
      오류 메시지
    */
    .func-err {
      color: #c0392b;
      font-size: 11px;
      padding-left: 28px;
    }

    /* ======================================================
       일반 버튼
       ====================================================== */

    button {
      cursor: pointer;
    }

    #add-func-btn {
      align-self: flex-start;

      padding: 6px 14px;

      border: 1px solid #ccc;
      border-radius: 6px;

      background: white;
    }

    #add-func-btn:hover {
      background: #f0f0f0;
    }

    /* ======================================================
       계산 결과 박스
       ====================================================== */

    #result-area {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
    }

    .res-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }

    .res-val {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      word-break: break-all;
    }

    /* ======================================================
       오른쪽 계산기 영역
       ====================================================== */

    #right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /*
      계산기 입력창

      readonly 제거함
      → 모바일 키보드 사용 가능
    */
    #calc-input {
      width: 100%;

      font-size: 16px;

      font-family: 'Courier New', monospace;

      padding: 10px;

      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #calc-input:focus {
      outline: none;
      border-color: #378ADD;
    }

    /* ======================================================
       키패드
       ====================================================== */

    .pad {
      display: grid;

      /*
        4칸 균등 분할
      */
      grid-template-columns: repeat(4, 1fr);

      gap: 6px;
    }

    .pad button {
      padding: 10px 4px;

      border: 1px solid #ddd;
      border-radius: 6px;

      background: white;

      font-size: 13px;

      font-family: 'Courier New', monospace;
    }

    .pad button:hover {
      background: #f0f0f0;
    }

    /*
      = 버튼
    */
    .btn-eq {
      background: #dceeff !important;
      border-color: #9ec9f5 !important;
      font-weight: bold;
    }

    /*
      삭제 버튼
    */
    .btn-del {
      background: #fdeaea !important;
      border-color: #f0b8b8 !important;
    }

    .pad-label {
      font-size: 11px;
      color: #888;
    }

    /*
      그래프 추가 버튼
    */
    #insert-graph-btn {
      padding: 8px;

      background: #e8f4fc;

      border: 1px solid #b3d4f0;
      border-radius: 6px;
    }

    /* ======================================================
       모바일 반응형
       ====================================================== */

    /*
      화면 너비가 768px 이하이면
      모바일 모드 실행
    */
    @media (max-width: 768px) {

      /*
        가로 배치 → 세로 배치
      */
      #app {
        grid-template-columns: 1fr;
      }

      /*
        계산기를 위로 올림
      */
      #right {
        order: -1;
      }

      /*
        모바일에서 그래프 높이 축소
      */
      #graph {
        height: 280px;
      }

      /*
        버튼 크게
      */
      .pad button {
        padding: 14px 6px;
        font-size: 15px;
      }

      /*
        모바일 입력 글자 확대
      */
      .func-input,
      #calc-input {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

  <h1>고등수학 그래프 계산기</h1>

  <div id="app">

    <!-- ======================================================
         왼쪽 영역
         ====================================================== -->

    <div id="left">

      <!-- 그래프 -->
      <div id="graph-container">
        <canvas id="graph"></canvas>
      </div>

      <!-- 축 범위 -->
      <div id="axis-controls">

        <label>x min</label>
        <input type="number" id="xmin" value="-10">

        <label>x max</label>
        <input type="number" id="xmax" value="10">

        <label>y min</label>
        <input type="number" id="ymin" value="-10">

        <label>y max</label>
        <input type="number" id="ymax" value="10">

        <button onclick="drawAll()">다시 그리기</button>

      </div>

      <!-- 함수 목록 -->
      <div id="func-list"></div>

      <button id="add-func-btn" onclick="addFunc()">
        + 함수 추가
      </button>

      <!-- 계산 결과 -->
      <div id="result-area">

        <div class="res-label">
          계산 결과
        </div>

        <div class="res-val" id="res-val">
          수식을 입력하세요
        </div>

      </div>

    </div>

    <!-- ======================================================
         오른쪽 계산기
         ====================================================== -->

    <div id="right">

      <!--
        readonly 제거
        → 모바일 직접 입력 가능
      -->
      <input type="text" id="calc-input">

      <div class="pad-label">숫자 / 연산</div>
      <div class="pad" id="pad-num"></div>

      <div class="pad-label">함수</div>
      <div class="pad" id="pad-fn"></div>

      <button id="insert-graph-btn" onclick="insertToGraph()">
        그래프에 추가
      </button>

    </div>

  </div>

  <script>

    // ======================================================
    // 함수 색상 배열
    // ======================================================

    /*
      여러 함수 구분하기 위해 사용

      함수 추가할 때 순서대로 사용됨
    */
    const COLORS = [
      '#378ADD',
      '#D85A30',
      '#1D9E75',
      '#D4537E',
      '#BA7517'
    ];

    /*
      함수 저장 배열

      예:
      [
        {expr:'sin(x)', color:'#378ADD'}
      ]
    */
    let funcs = [];

    /*
      Chart.js 객체 저장 변수

      그래프 다시 그릴 때 이전 그래프 제거하려고 필요
    */
    let chart = null;

    // ======================================================
    // 함수 추가
    // ======================================================

    function addFunc(expr = '') {

      /*
        현재 함수 개수
      */
      const idx = funcs.length;

      funcs.push({

        /*
          함수 식
        */
        expr: expr,

        /*
          색상 순환
        */
        color: COLORS[idx % COLORS.length],

        /*
          오류 메시지
        */
        err: ''

      });

      renderFuncList();

      drawAll();
    }

    // ======================================================
    // 함수 삭제
    // ======================================================

    function removeFunc(index) {

      /*
        splice:
        배열 요소 제거
      */
      funcs.splice(index, 1);

      renderFuncList();

      drawAll();
    }

    // ======================================================
    // 함수 목록 화면 렌더링
    // ======================================================

    function renderFuncList() {

      const container =
        document.getElementById('func-list');

      /*
        기존 HTML 제거
      */
      container.innerHTML = '';

      funcs.forEach((f, i) => {

        const row =
          document.createElement('div');

        row.className = 'func-row';

        row.innerHTML = `
          <span class="color-dot"
                style="background:${f.color}">
          </span>

          <input
            class="func-input"
            value="${f.expr}"
            placeholder="예: sin(x)"
          >

          <button
            class="remove-btn"
            onclick="removeFunc(${i})">
            ×
          </button>
        `;

        container.appendChild(row);

        const input =
          row.querySelector('input');

        /*
          실시간 입력 이벤트
        */
        input.addEventListener('input', function () {

          funcs[i].expr = this.value;

          drawAll();
        });

      });
    }

    // ======================================================
    // 그래프 그리기
    // ======================================================

    function drawAll() {

      /*
        축 값 읽기
      */
      const xmin =
        parseFloat(
          document.getElementById('xmin').value
        );

      const xmax =
        parseFloat(
          document.getElementById('xmax').value
        );

      const ymin =
        parseFloat(
          document.getElementById('ymin').value
        );

      const ymax =
        parseFloat(
          document.getElementById('ymax').value
        );

      /*
        점 개수

        많을수록 부드러움
        대신 느려짐
      */
      const N = 500;

      const step =
        (xmax - xmin) / N;

      /*
        Chart.js dataset 생성
      */
      const datasets = funcs.map((f) => {

        /*
          빈 수식 무시
        */
        if (!f.expr.trim()) return null;

        let compiled;

        try {

          /*
            수식 컴파일

            매 x마다 파싱하면 느림
            그래서 미리 컴파일
          */
          compiled =
            math.compile(f.expr);

        } catch {

          return null;
        }

        const points = [];

        for (let i = 0; i <= N; i++) {

          const x =
            xmin + i * step;

          try {

            /*
              x 대입 계산
            */
            const y =
              compiled.evaluate({x});

            /*
              유효 숫자인지 검사
            */
            if (
              typeof y === 'number' &&
              isFinite(y)
            ) {

              points.push({x, y});

            } else {

              /*
                null이면 선 끊김
              */
              points.push({x, y:null});
            }

          } catch {

            points.push({x, y:null});
          }
        }

        return {

          label: 'y=' + f.expr,

          data: points,

          borderColor: f.color,

          borderWidth: 2,

          pointRadius: 0,

          fill: false
        };

      }).filter(Boolean);

      /*
        이전 그래프 제거

        안 하면 그래프 겹침
      */
      if (chart) {
        chart.destroy();
      }

      const ctx =
        document.getElementById('graph')
        .getContext('2d');

      /*
        새 그래프 생성
      */
      chart = new Chart(ctx, {

        type: 'line',

        data: {
          datasets
        },

        options: {

          animation: false,

          parsing: false,

          responsive: true,

          maintainAspectRatio: false,

          scales: {

            x: {
              type: 'linear',
              min: xmin,
              max: xmax
            },

            y: {
              min: ymin,
              max: ymax
            }
          }
        }
      });
    }

    // ======================================================
    // 계산 실행
    // ======================================================

    function calcEval() {

      const expr =
        document.getElementById('calc-input')
        .value;

      const res =
        document.getElementById('res-val');

      try {

        /*
          math.js 계산
        */
        const result =
          math.evaluate(expr);

        res.textContent =
          result.toString();

      } catch (e) {

        res.textContent =
          '오류: ' + e.message;
      }
    }

    // ======================================================
    // 계산기 → 그래프 추가
    // ======================================================

    function insertToGraph() {

      const expr =
        document.getElementById('calc-input')
        .value;

      if (!expr.trim()) return;

      addFunc(expr);
    }

    // ======================================================
    // 입력창 텍스트 삽입
    // ======================================================

    function ins(text) {

      const input =
        document.getElementById('calc-input');

      input.value += text;
    }

    // ======================================================
    // 백스페이스
    // ======================================================

    function bksp() {

      const input =
        document.getElementById('calc-input');

      input.value =
        input.value.slice(0, -1);
    }

    // ======================================================
    // 버튼 데이터
    // ======================================================

    const numBtns = [

      ['7','7'],
      ['8','8'],
      ['9','9'],
      ['/','÷'],

      ['4','4'],
      ['5','5'],
      ['6','6'],
      ['*','×'],

      ['1','1'],
      ['2','2'],
      ['3','3'],
      ['-','−'],

      ['0','0'],
      ['.','.'],
      ['+','+'],
      ['=','='],

      ['⌫','⌫']
    ];

    const fnBtns = [

      ['sin(','sin'],
      ['cos(','cos'],
      ['tan(','tan'],
      ['sqrt(','√'],

      ['log(','log'],
      ['ln(','ln'],
      ['pi','π'],
      ['e','e']
    ];

    // ======================================================
    // 패드 생성 함수
    // ======================================================

    function buildPad(id, btns) {

      const pad =
        document.getElementById(id);

      btns.forEach(([value, label]) => {

        const btn =
          document.createElement('button');

        btn.textContent = label;

        if (value === '=') {

          btn.className = 'btn-eq';

          btn.onclick = calcEval;

        } else if (value === '⌫') {

          btn.className = 'btn-del';

          btn.onclick = bksp;

        } else {

          btn.onclick = () => ins(value);
        }

        pad.appendChild(btn);
      });
    }

    // ======================================================
    // 패드 생성 실행
    // ======================================================

    buildPad('pad-num', numBtns);

    buildPad('pad-fn', fnBtns);

    // ======================================================
    // 초기 함수
    // ======================================================

    addFunc('sin(x)');

    addFunc('x^2');

  </script>

</body>
</html>
